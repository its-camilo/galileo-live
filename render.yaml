services:
  - type: web
    name: galileo-live-api
    runtime: docker
    rootDir: api
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    disk:
      name: galileo-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: GALILEO_DATA_DIR
        value: /data
      - key: APP_JWT_AUDIENCE
        value: galileo-vps
      - key: META_CHAT_MODEL
        value: muse-spark-1.3
      - key: APP_JWT_SECRET
        sync: false
      - key: MODEL_API_KEY
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://galileo-live.vercel.app,http://localhost:3000
